KK.frame(`<div class="doc-help" style="max-width:860px">
<h1 class="doc-h1">Как работает КассаКонтроль</h1>
<p>Сервис смотрит видеозапись с камеры над рабочим местом кассира и находит моменты, которые могут противоречить правилам кассовой дисциплины. Он не выносит решений: каждая находка — это подсказка проверяющему с кадрами, объяснением и ссылкой на пункт норматива.</p>
<h2 class="doc-h2">Пять шагов анализа</h2>
<ol>
<li><b>Загрузка.</b> Видео попадает на этот сервер и никуда дальше не передаётся. Внешние ИИ-сервисы не используются.</li>
<li><b>Кадры.</b> Из записи берётся 5 кадров в секунду; раз в секунду кадр рассматривается крупнее, чтобы заметить мелкие предметы на столе.</li>
<li><b>Люди и предметы.</b> Открытая модель YOLOX-s (лицензия Apache-2.0) находит людей, ноутбук, стол, предметы; ByteTrack связывает людей в треки. Кассир — тот, кто дольше всех у рабочего места. Лица не распознаются.</li>
<li><b>Правила.</b> Найденные моменты проверяются по четырём ситуациям: <b>уход кассира</b> (что осталось на столе, включён ли экран), <b>вход человека</b> (посторонний, деньги прошлого клиента), <b>обслуживание</b> (инкассатор ушёл до проверки), <b>рабочее место</b> (личные вещи, напитки). Все пороги заданы в долях роста человека, а не в пикселях, поэтому работают при другом ракурсе камеры.</li>
<li><b>Заключение.</b> Для каждого события: тип, время, 1–3 кадра, что видно, норма дословно со ссылкой на adilet.zan.kz, чего по видео не видно и что проверить. То же самое отдаёт API и печатная форма PDF.</li>
</ol>
<h2 class="doc-h2">Как читать результат</h2>
<div class="help-box">
<p><b>◆ Нарушение</b> — признак найден уверенно. <b>▲ Требует проверки</b> — признак слабый или объект частично скрыт: посмотрите фрагмент сами.</p>
<p><b>Нарушение не обнаружено</b> — по семи категориям признаков нет. Это не гарантия: система не проверяет то, чего не видно на видео (проводки, сверку, подлинность банкнот, документы клиента), и в этой версии не проверяет состояние сейфа, ключа и двери.</p>
<p><b>Подтвердить / Не нарушение / Нужна доп. проверка</b> — решение проверяющего. Вывод системы при этом не удаляется: в заключении видно и то и другое.</p>
</div>
<h2 class="doc-h2">Ограничения и честные оговорки</h2>
<ul>
<li>Проверяются 9 из 17 типов каталога. Остальные (сейф открыт, ключ в замке, дверь не закрыта, порядок пересчёта, документ клиента, детектор банкнот) требуют отдельной модели и отмечены как «не проверялось».</li>
<li>Ссылки на нормы берутся только из каталога правил, сверенного вручную с adilet.zan.kz; модель их не придумывает.</li>
<li>Предел на одно видео — 4 минуты. Если время кончается, сервис отдаёт лучший частичный результат и говорит об этом, а не отвечает «нарушений нет».</li>
<li>Видео удаляется сразу после анализа, результат хранится 24 часа.</li>
</ul>
<h2 class="doc-h2">Для разработчиков</h2>
<p>API: <code class="doc-code">POST /api/v1/analyze</code> и <code class="doc-code">GET /api/v1/jobs/{id}</code> с заголовком <code class="doc-code">X-API-Key</code>. Подробности — на странице <a href="api.html">API для жюри</a>. Каталог норм — <a href="rules.html">здесь</a>.</p>
</div>`, { active: "help", crumbs: `<a href="index.html">Проверки</a><span class="sep">/</span><b>Как это работает</b>` });
