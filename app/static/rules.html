<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог правил — КассаКонтроль</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="root" style="min-height:100vh"></div>
<script src="ui.js"></script>
<script>
(async () => {
  const cat = await (await fetch("rules.json")).json();
  const esc = KK.esc;
  const implemented = new Set(["T01","T02","T03","T06","T08","T09","T10","T15","T16"]);
  const byMoment = {};
  cat.types.forEach(t => (byMoment[t.moment] = byMoment[t.moment] || []).push(t));
  const card = t => { const d = cat.documents[t.source.doc]; return `<div class="rc"><div class="h"><span class="mono">${t.id}</span><b>${esc(t.type)}</b><span class="st ${implemented.has(t.id) ? "on" : "off"}">${implemented.has(t.id) ? "проверяется автоматически" : "в этой версии не проверяется"}</span></div>
    <div class="b"><span class="lab">Норма</span><div><b>${esc(d.short)}, ${esc(t.source.point)}</b> · <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url.replace("https://",""))}</a><div style="font-size:12px;color:var(--label);margin-top:2px">${esc(d.full)}</div></div>
    <span class="lab">Цитата</span><q>«${esc(t.source.quote)}»</q>
    ${(t.extra_sources||[]).length ? `<span class="lab">Также</span><div>${t.extra_sources.map(x => `${esc(cat.documents[x.doc].short)}, ${esc(x.point)}${x.quote ? `: «${esc(x.quote)}»` : ""}`).join("<br>")}</div>` : ""}
    ${t.extra_text ? `<span class="lab">Пояснение</span><div style="color:var(--text2)">${esc(t.extra_text)}</div>` : ""}
    <span class="lab">Что видно на видео</span><div>${esc(t.observation.replace(/\{[a-z_]+\}/g, "…"))}</div>
    <span class="lab">Почему это может быть нарушением</span><div>${esc(t.interpretation)}</div>
    <span class="lab">Чего по видео не видно</span><div style="color:var(--text2)">${esc(t.cannot_see)}</div>
    <span class="lab">Что проверить человеку</span><div>${esc(t.check)}</div></div></div>`; };
  const main = `<h1 class="doc-h1">Каталог правил и норм</h1><p class="doc-lead">${esc(cat.note)} Всего ${cat.types.length} типов; ${implemented.size} из них проверяются автоматически в текущей версии, остальные описаны для полноты и ручной проверки.</p>
    ${Object.entries(cat.moments).map(([k, title]) => byMoment[k] ? `<div class="mom">${esc(title)}</div>${byMoment[k].map(card).join("")}` : "").join("")}
    <div class="mom">Источники</div>${Object.values(cat.documents).map(d => `<div class="rc"><div class="b"><span class="lab">${esc(d.short)}</span><div>${esc(d.full)}<br><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a></div></div></div>`).join("")}`;
  KK.frame(main, { active: "rules", crumbs: `<a href="index.html">Проверки</a><span class="sep">/</span><b>Каталог правил</b>`, st: [`каталог правил от ${esc(cat.version)}`, `${cat.types.length} типов`, `${implemented.size} проверяются автоматически`] });
})();
</script>
</body>
</html>
