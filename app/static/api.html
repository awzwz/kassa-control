<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API для жюри — КассаКонтроль</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="root" style="min-height:100vh"></div>
<script src="ui.js"></script>
<script>
(() => {
  const host = location.origin;
  const main = `<div class="doc-grid"><div>
    <h1 class="doc-h1">API для автоматической проверки</h1>
    <p class="doc-lead">Два запроса: загрузить видео и забрать результат. Формат ответа — ровно как в разделе 10 технического задания.</p>
    <div class="doc-kv">
      <div><span>Адрес</span><span><code class="doc-code">${host}</code></span></div>
      <div><span>Ключ</span><span>передаётся в заголовке <code class="doc-code">X-API-Key</code>; без ключа — <code class="doc-code">401</code></span></div>
      <div><span>Формат видео</span><span>.mov (также .mp4), поле формы <code class="doc-code">file</code>, до 200 МБ</span></div>
      <div><span>Время ответа</span><span>обычно 30–120 с, внутренний предел 4 минуты; при нехватке времени отдаётся лучший частичный результат</span></div>
      <div><span>Интерфейс</span><span><a href="index.html">${host}/ui/</a> — тот же ключ</span></div>
    </div>
    <h2 class="doc-h2"><span class="doc-m post">POST</span><code>/api/v1/analyze</code></h2>
    <p style="margin:0;color:var(--text2)">Принимает видео и сразу возвращает <code class="doc-code">job_id</code>. Обработка идёт в фоне.</p>
    <h2 class="doc-h2"><span class="doc-m get">GET</span><code>/api/v1/jobs/{job_id}</code></h2>
    <table class="doc-tbl"><thead><tr><th>status</th><th>Что значит</th></tr></thead><tbody>
      <tr><td>processing</td><td>Видео в очереди или анализируется. Повторите запрос через 3–5 секунд.</td></tr>
      <tr><td>done</td><td>Готово: <code class="doc-code">verdict</code> и список <code class="doc-code">violations</code>.</td></tr>
      <tr><td>failed</td><td>Файл не читается как видео. Поле <code class="doc-code">error</code> объясняет причину. Это не означает отсутствия нарушений.</td></tr>
    </tbody></table>
    <h2 class="doc-h2">Формат ответа</h2>
    <table class="doc-tbl"><thead><tr><th>Поле</th><th>Описание</th></tr></thead><tbody>
      <tr><td>verdict</td><td><code class="doc-code">violation</code> или <code class="doc-code">no_violation</code></td></tr>
      <tr><td>violations[].type</td><td>Тип нарушения из каталога (17 типов)</td></tr>
      <tr><td>violations[].timecode_sec</td><td>Секунда от начала видео</td></tr>
      <tr><td>violations[].description</td><td>Что видно, почему это может быть нарушением, строка «Основание: …» с пунктом норматива и ссылкой на adilet.zan.kz</td></tr>
      <tr><td>violations[].evidence_frames</td><td>1–3 кадра JPEG в base64 без пометок: в момент события, за 1 с до и через 1 с после</td></tr>
    </tbody></table>
    <h2 class="doc-h2">Служебное</h2>
    <table class="doc-tbl"><tbody>
      <tr><td>GET /health</td><td>состояние сервиса и длина очереди, без ключа</td></tr>
      <tr><td>GET /api/v1/jobs</td><td>список задач</td></tr>
      <tr><td>GET /api/v1/jobs/{id}/progress</td><td>ход анализа и подробности для интерфейса (сигналы, рамки, норма)</td></tr>
      <tr><td>GET /api/docs</td><td>интерактивная документация OpenAPI</td></tr>
    </tbody></table>
  </div>
  <aside>
    <div class="doc-block"><div class="hd"><span>1. Отправить видео</span></div><pre>API=${host}
<span class="k">curl</span> -X POST $API/api/v1/analyze \\
  -H <span class="s">"X-API-Key: ••••••••"</span> \\
  -F <span class="s">"file=@video_017.mov"</span>

<span class="c"># ответ</span>
{ <span class="s">"job_id"</span>: <span class="s">"3f2a9c1e"</span>, <span class="s">"status"</span>: <span class="s">"processing"</span> }</pre></div>
    <div class="doc-block"><div class="hd"><span>2. Забрать результат</span></div><pre><span class="k">curl</span> $API/api/v1/jobs/3f2a9c1e \\
  -H <span class="s">"X-API-Key: ••••••••"</span>

<span class="c"># ответ (сокращён)</span>
{
  <span class="s">"job_id"</span>: <span class="s">"3f2a9c1e"</span>,
  <span class="s">"status"</span>: <span class="s">"done"</span>,
  <span class="s">"verdict"</span>: <span class="s">"violation"</span>,
  <span class="s">"violations"</span>: [{
    <span class="s">"type"</span>: <span class="s">"Наличные оставлены без присмотра"</span>,
    <span class="s">"timecode_sec"</span>: <span class="n">10.0</span>,
    <span class="s">"description"</span>: <span class="s">"Кассир отходит от рабочего места… Основание: Правила № 231, п. 20, ч. 2 (https://adilet.zan.kz/…)"</span>,
    <span class="s">"evidence_frames"</span>: [
      { <span class="s">"timestamp_sec"</span>: <span class="n">10.0</span>, <span class="s">"image_base64"</span>: <span class="s">"/9j/4AAQ…"</span> }
    ]
  }]
}</pre></div>
    <div class="doc-note">${KK.I.lock.replace("<svg", '<svg style="width:16px;height:16px;flex:none;margin-top:2px;color:var(--ok)"')}<span>Кадры, тексты и ссылки на нормы формирует сервис на своём сервере. Внешние AI-сервисы не вызываются; лица не распознаются; видео удаляется после анализа.</span></div>
  </aside></div>`;
  KK.frame(main, { active: "api", crumbs: `<a href="index.html">Проверки</a><span class="sep">/</span><b>API для жюри</b>`, width: "1240px", st: ["API: /api/v1/analyze, /api/v1/jobs/{id}", "ответ по §10 ТЗ", "OpenAPI: /api/docs"] });
})();
</script>
</body>
</html>
